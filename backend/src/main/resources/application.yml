spring:
  datasource:
    url: jdbc:h2:mem:swaravault;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:none}
        secure: ${SESSION_COOKIE_SECURE:true}
        http-only: true

storage:
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}        # blank = native AWS S3; set for Cloudflare R2 or MinIO
    access-key: ${S3_ACCESS_KEY:}    # blank = use EC2 IAM role; set for R2/custom
    secret-key: ${S3_SECRET_KEY:}
    public-url: ${S3_PUBLIC_URL}     # CloudFront URL or S3/R2 public bucket URL
    snapshot-key: ${S3_SNAPSHOT_KEY:db-seed/snapshot.sql}  # H2 SCRIPT snapshot object key (ADR 0001)

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
